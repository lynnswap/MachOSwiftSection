name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos_test:
    name: Execute tests on macOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon runners only: MachOFileTests.preferredArchitecture == .arm64.
        # Adding an Intel runner would load a different arch slice and drift snapshots.
        os: [macos-26]
        xcode-version: ["26.6"]
        # debug and release run as parallel jobs — sequentially they doubled
        # the wall clock (14m + 21m cold). Release stays in the matrix on
        # purpose: optimizer-sensitive pointer bugs only surface there.
        configuration: [debug, release]
    env:
      MACHO_SWIFT_SECTION_SILENT_TEST: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Swift version
        run: swift --version

      - name: Resolve SPM dependencies
        run: swift package update

      - name: Cache SymbolTests DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tests/Projects/SymbolTests/DerivedData
          key: symboltests-${{ matrix.xcode-version }}-${{ hashFiles('Tests/Projects/SymbolTests/**/*.swift', 'Tests/Projects/SymbolTests/**/*.pbxproj', '.github/workflows/macOS.yml') }}

      - name: Build SymbolTestsCore fixture
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Tests/Projects/SymbolTests/SymbolTests.xcodeproj \
            -scheme SymbolTestsCore \
            -configuration Release \
            -derivedDataPath Tests/Projects/SymbolTests/DerivedData \
            -destination 'generic/platform=macOS' \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize fixture framework paths
        run: |
          set -eo pipefail
          # The tests look for the frameworks under DerivedData/SymbolTests/...,
          # while xcodebuild writes them to DerivedData/Build/Products/Release.
          # Link every framework the tests need, not just SymbolTestsCore:
          # DependencyClosureTests resolves SymbolTestsHelper through the same
          # expected path, and omitting it fails that suite with
          # "The file SymbolTestsHelper doesn't exist".
          root="Tests/Projects/SymbolTests/DerivedData"
          expected_dir="$root/SymbolTests/Build/Products/Release"
          echo "--- frameworks found under DerivedData ---"
          find "$root" -path '*/Build/Products/Release/*.framework' -maxdepth 6 -type d 2>/dev/null || true
          mkdir -p "$expected_dir"
          for framework in SymbolTestsCore SymbolTestsHelper; do
            expected="$expected_dir/$framework.framework"
            if [ -d "$expected" ] && [ ! -L "$expected" ]; then
              echo "$framework already at expected path; nothing to do."
              continue
            fi
            # Prefer a Release build product (skip Intermediates and Debug).
            found=$(find "$root" -path "*/Build/Products/Release/$framework.framework" -type d 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "ERROR: $framework.framework not found at any Build/Products/Release/ path."
              echo "--- DerivedData top 3 levels ---"
              find "$root" -maxdepth 3 -type d
              exit 1
            fi
            ln -sfn "$(realpath "$found")" "$expected"
            echo "Linked $found -> $expected"
            ls -la "$expected/Versions/A/$framework"
          done

      - name: Upload xcodebuild logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symboltests-derived-data-logs-${{ matrix.configuration }}
          path: Tests/Projects/SymbolTests/DerivedData/Logs
          if-no-files-found: ignore

      - name: Cache SwiftPM build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-test-${{ matrix.configuration }}
          # This step runs after `swift package update`, so the key hashes the
          # post-update Package.resolved: a floated dependency bump rotates
          # the key, and restore-keys falls back to the newest cache for the
          # same configuration — an almost-warm build instead of a cold one.
          key: spm-build-${{ matrix.os }}-${{ matrix.xcode-version }}-${{ matrix.configuration }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-build-${{ matrix.os }}-${{ matrix.xcode-version }}-${{ matrix.configuration }}-

      - name: Build and run tests (${{ matrix.configuration }})
        run: |
          swift test \
            -c ${{ matrix.configuration }} \
            --enable-experimental-prebuilts \
            --build-path .build-test-${{ matrix.configuration }} \
            --filter '\.(Arm64eSignedVWTPointerTests|FieldLayoutAccessorResolutionTests|DiffOutputTests|SymbolTestsCoreDumpSnapshotTests|SymbolTestsCoreInterfaceSnapshotTests|SymbolTestsCoreCoverageInvariantTests|STCoreE2ETests|STCoreTests|GenericSpecializationTests|MultiPayloadEnumTests|MetadataReaderDemanglingTests|DependencyLoadNameTests|DependencyClosureTests|FileDependencyLocatorTests|SwiftInterfaceBuilderDependenciesTests|ManglingPrefixTests|MethodDescriptorTests|MethodOverrideDescriptorTests|MethodDefaultOverrideDescriptorTests|ProtocolRequirementTests|ResilientWitnessTests|LargeStackTaskExecutionTests|BoundedConcurrentMapTests|SwiftEvolutionInterfaceBuilderTests|EvolutionCommandValidationTests|DiffCommandValidationTests)(/|$)'

      - name: Build MCP field-layout fixture
        run: swiftc -emit-library -module-name MCPFixture MCP/Fixtures/FieldLayoutFixture.swift -o "$RUNNER_TEMP/libMCPFixture.dylib"

      - name: Test MCP package (${{ matrix.configuration }})
        env:
          MCP_FIELD_LAYOUT_FIXTURE: ${{ runner.temp }}/libMCPFixture.dylib
        run: swift test --package-path MCP -c ${{ matrix.configuration }} --scratch-path .build-test-${{ matrix.configuration }}
